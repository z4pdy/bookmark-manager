services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookmarks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    ports:
      - "5433:5432"
    volumes:
      - db-volume:/var/lib/postgresql
  
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/bookmarks
    ports:
      - "8181:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8081:80"

volumes:
  db-volume:
